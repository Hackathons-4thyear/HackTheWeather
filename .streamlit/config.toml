# Committed so local and Streamlit Cloud render identically.
# Palette: "modern field notebook" agritech identity - see ui/styles.css.

[theme]
base = "light"
primaryColor = "#2E7D4F"            # leaf green
backgroundColor = "#FAF7F0"         # paper off-white
secondaryBackgroundColor = "#F2EDE3"
textColor = "#1C2A24"               # ink
font = "sans serif"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
